		.rotate{

		  top: 0;
		  left: 0;
		  right: 0;

		  width : 100%;
		  height : 100%;
		  animation : animate 5s linear infinite;
		  -ms-animation : animate 5s linear infinite;
		}
		.rotate > p{
		  content : '';
		  position : absolute;
		  width : 40%;
		  height : 40%;
			background-color: transparent;
		  border-radius : 50%;
		}
		.rotate > p:nth-of-type(1){
		  top : 0;
		  left : 0;
		  right : 0;
		  margin : 0 auto;
		  box-shadow : 0 0 150px #8dff08;
		}
		.rotate > p:nth-of-type(2){

			-webkit-transform: translateY(-50%);
			-moz-transform: translateY(-50%);
			-o-transform: translateY(-50%);
			-ms-transform: translateY(-50%);
		  right : 0;
		  box-shadow : 0 0 150px #ffeb3b;
		}
		.rotate > p:nth-of-type(3){
		  bottom : 0;
		  left : 0;
		  right : 0;
		  margin : 0 auto;
		  box-shadow : 0 0 150px #ff3b8d;
		}
		.rotate > p:nth-of-type(4){
		  top : 50%;
			-webkit-transform: translateY(-50%);
			-moz-transform: translateY(-50%);
			-o-transform: translateY(-50%);
			-ms-transform: translateY(-50%);
			transform: translateY(-50%);
		  left : 0;
		  box-shadow : 0 0 150px #07b2ff;
		}
		.loader span{
		  position : absolute;
		  top : 0;
		  left : 0;
		  width : 100%;
		  height : 100%;
		  border-radius : 50%;
		  z-index: 1;
		  display: -webkit-box;
		  display: -ms-flexbox;
		  display : flex;
		  -webkit-box-pack: center;
		  -ms-flex-pack: center;
		  justify-content : center;
		  -webkit-box-align: center;
		  -ms-flex-align: center;
		  align-items: center;
		  text-transform : uppercase;
		  letter-spacing : 5px;
		  font-weight: 500;
		  font-size : 18px;
			font-family: "notosans", sans-serif;
			animation: space_ani 1.5s ease-in-out infinite alternate;
		  color : rgba(255,255,255,0.6);
			background-color : rgba(0,0,0,0.2);
		}
		.loader span::before{
		  content : '';
		  position : absolute;
		  top : 8px;
		  left : 8px;
		  right : 8px;
		  bottom : 8px;
		  background : transparent;
		  border-radius : 50%;
		  box-shadow : inset 0 0 20px rgba(255,255,255,0.08);
		}
	</style>
